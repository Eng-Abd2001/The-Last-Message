<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echo: نسخة الغد</title>
    <meta name="description" content="واجه نسختك المستقبلية في تحدي نفسي فريد.">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>
    <div id="glitch-overlay"></div>
    
    <!-- شاشة البداية -->
    <section id="screen-intro" class="screen active">
        <div class="content">
            <h1 class="glitch-text" data-text="ECHO">ECHO</h1>
            <h2 class="subtitle">نسخة الغد</h2>
            <p class="description">أنت لا تواجه خصماً عادياً.. أنت تواجه نسختك المستقبلية. اللعبة ستراقب أخطاءك، تحلل سرعة استجابتك، وتبني خصماً يمثلك.. هل يمكنك هزيمة نفسك؟</p>
            <button id="btn-start" class="neon-btn">ابدأ التحدي المتزامن</button>
        </div>
    </section>

    <!-- واجهة اللعب -->
    <section id="screen-game" class="screen">
        <header id="game-hud">
            <div class="stat">المستوى: <span id="hud-level">1</span></div>
            <div class="stat">XP: <span id="hud-xp">0</span></div>
            <div class="stat">المرحلة: <span id="hud-phase">السرعة</span></div>
        </header>
        <div id="game-container">
            <!-- المحتوى يتغير برمجياً -->
        </div>
        <div id="ai-progress-container" class="hidden">
            <div class="progress-label">نسختك المستقبلية:</div>
            <div class="progress-bar"><div id="ai-progress-fill"></div></div>
        </div>
    </section>

    <!-- شاشة النتيجة -->
    <section id="screen-result" class="screen">
        <div class="content">
            <h2 class="glitch-text" data-text="التحليل النهائي">التحليل النهائي</h2>
            <div id="result-stats" class="stats-grid">
                <!-- يتم ملؤها برمجياً -->
            </div>
            <h3 class="player-title">اللقب: <span id="final-title">المبتدئ</span></h3>
            <div class="action-buttons">
                <button id="btn-restart" class="neon-btn">إعادة التهيئة</button>
                <button id="btn-share" class="neon-btn outline">شارك نتيجتك</button>
            </div>
        </div>
    </section>

    <script src="game.js"></script>
</body>
</html>
