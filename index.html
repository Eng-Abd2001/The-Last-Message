<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>المحقق داخل الهاتف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h1>استخراج البيانات...</h1>
    </div>

    <!-- الهاتف (يأخذ حجم الشاشة بالكامل على الموبايل) -->
    <div id="phone">
        <!-- شريط الحالة العلوي -->
        <div id="status-bar">
            <span id="clock">12:00</span>
            <div class="dynamic-island"></div>
            <div class="status-icons">
                <span>📶 5G</span>
                <span>🔋 12%</span>
            </div>
        </div>

        <!-- شاشة القفل -->
        <div id="lock-screen" class="screen active">
            <div class="lock-header">
                <h1 id="lock-time">12:00</h1>
                <p id="lock-date">الاثنين، 22 نوفمبر</p>
            </div>
            <div class="lock-notifications">
                <div class="lock-notif">
                    <strong>الظل (رسالة مشفرة)</strong>
                    <span>لقد تم اختراق دائرتك.. احذر!</span>
                </div>
            </div>
            <div class="swipe-area" id="swipe-up-btn">
                <div class="swipe-text">اسحب للأعلى للفتح</div>
                <div class="home-indicator-lock"></div>
            </div>
        </div>

        <!-- الشاشة الرئيسية (التطبيقات) -->
        <div id="home-screen" class="screen hidden">
            <div class="apps-grid">
                <div class="app-icon" data-app="messages">
                    <div class="icon-bg msg-bg">💬</div>
                    <span>الرسائل</span><div class="badge">2</div>
                </div>
                <div class="app-icon" data-app="gallery">
                    <div class="icon-bg gal-bg">🖼️</div>
                    <span>الصور</span>
                </div>
                <div class="app-icon" data-app="notes">
                    <div class="icon-bg not-bg">📝</div>
                    <span>الملاحظات</span>
                </div>
                <div class="app-icon" data-app="files">
                    <div class="icon-bg fil-bg">📁</div>
                    <span>الملفات</span>
                </div>
                <div class="app-icon" data-app="calls">
                    <div class="icon-bg cal-bg">📞</div>
                    <span>المكالمات</span>
                </div>
                <div class="app-icon" data-app="browser">
                    <div class="icon-bg web-bg">🌐</div>
                    <span>المتصفح</span>
                </div>
                <div class="app-icon" data-app="evidence">
                    <div class="icon-bg evi-bg">🔍</div>
                    <span>الأدلة</span>
                </div>
                <div class="app-icon" data-app="analysis">
                    <div class="icon-bg ana-bg">⚖️</div>
                    <span>التحليل</span>
                </div>
            </div>
            <div class="player-stats">
                الأدلة المكتشفة: <span id="evidence-count">0</span>/4
            </div>
        </div>

        <!-- حاوية التطبيق المفتوح -->
        <div id="app-container" class="screen hidden">
            <div id="app-header">
                <button id="back-btn">❮ رجوع</button>
                <h2 id="app-title">التطبيق</h2>
                <div style="width: 60px;"></div> <!-- توازن العنوان -->
            </div>
            <div id="app-content"></div>
            <!-- مؤشر الهوم للخروج من التطبيق -->
            <div class="home-indicator-area" id="home-btn">
                <div class="home-indicator"></div>
            </div>
        </div>

        <!-- عارض الصور -->
        <div id="image-viewer" class="hidden">
            <button id="close-image">✖</button>
            <div id="image-frame"></div>
            <p id="image-caption"></p>
            <button id="extract-clue-btn" class="hidden">استخراج الدليل 🔍</button>
        </div>

        <!-- إشعارات الأدلة -->
        <div id="notification" class="hidden">
            <div class="notif-icon">💡</div>
            <div class="notif-text">
                <h4>دليل جديد!</h4>
                <p id="notif-desc">...</p>
            </div>
        </div>
    </div>

    <!-- نافذة النهاية -->
    <div id="ending-modal" class="hidden">
        <div class="modal-content">
            <h1 id="ending-title">النهاية</h1>
            <p id="ending-desc">وصف النهاية يظهر هنا.</p>
            <button id="restart-btn">العودة للواقع (إعادة اللعب)</button>
        </div>
    </div>

    <script src="cases.js"></script>
    <script src="script.js"></script>
</body>
</html>
